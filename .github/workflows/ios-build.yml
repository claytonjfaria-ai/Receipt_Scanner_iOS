name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Must be an image with Xcode 16+. XcodeGen emits pbxproj objectVersion 77, which
    # Xcode 15.x refuses to open — this exact failure mode was hit and fixed in
    # dev/iOs_Test (BillsCaptureTest), which proved this pipeline end to end 2026-08-18.
    # Pinning objectVersion in project.yml does NOT work; XcodeGen ignores it. The runner
    # image is the only real control here — do not downgrade this without checking.
    # macOS runners bill at ~10x the Linux minute multiplier. Build is ~2-3 minutes.
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        env:
          # Auto-incrementing build number (CFBundleVersion) -- every CI build gets a real,
          # unique, monotonically-increasing number for free. See project.yml's comment on
          # CURRENT_PROJECT_VERSION for the split with MARKETING_VERSION.
          BUILD_NUMBER: ${{ github.run_number }}
        run: xcodegen generate

      - name: Show toolchain and project format
        run: |
          xcodebuild -version
          echo "--- available Xcodes ---"
          ls /Applications | grep -i '^Xcode' || true
          echo "--- pbxproj objectVersion (must be readable by the Xcode above) ---"
          grep -m1 objectVersion ReceiptScannerBills.xcodeproj/project.pbxproj
          echo "--- available iOS Simulator runtimes/devices (for the test step below) ---"
          xcrun simctl list devices available | grep -A5 -- '-- iOS'

      # Milestone 3's pure filing logic (Sources/Filing/) is the first code in this app with
      # real correctness tests, not just "does it compile." Runs against the Simulator SDK —
      # a completely separate destination from the unsigned iphoneos build below, so it needs
      # no signing and can't be skipped by a build that merely compiles.
      - name: Run unit tests (Simulator)
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ReceiptScannerBills.xcodeproj \
            -scheme ReceiptScannerBills \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'

      # Step A of plan §8 (goal-receipt-scanner.../PLAN-MOBILE-BILLS-CAPTURE.md): compile
      # with signing switched off entirely. No Apple ID, no certificates, no interactive
      # session — this is why no Mac is needed anywhere.
      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ReceiptScannerBills.xcodeproj \
            -scheme ReceiptScannerBills \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      # Read back the version actually baked into the built app -- not recomputed separately,
      # so the filename below can never drift from what's really in the binary (and what the
      # app's own Diagnostics screen will show once installed).
      - name: Read built version
        id: version
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/ReceiptScannerBills.app"
          SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist")
          echo "Version: $SHORT ($BUILD)"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      # An .ipa is just a zip with the .app inside a Payload/ directory. Filename carries the
      # version/build so a download never silently overwrites a previous one on disk, and so
      # what's on Desktop always matches what the app's Diagnostics screen shows once installed
      # -- the actual point of this (see project.yml's CURRENT_PROJECT_VERSION comment).
      - name: Package .ipa
        id: package
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/ReceiptScannerBills.app"
          test -d "$APP_PATH" || { echo "::error::app bundle not found at $APP_PATH"; exit 1; }
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          IPA_NAME="ReceiptScannerBills-${{ steps.version.outputs.short }}-b${{ steps.version.outputs.build }}-unsigned.ipa"
          zip -qry "$IPA_NAME" Payload
          ls -lh "$IPA_NAME"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      # Artifact name itself stays stable/predictable across runs (easy to `gh run download -n
      # ...` without looking up a version first) -- the versioning lives in the file inside it.
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ReceiptScannerBills-unsigned-ipa
          path: ${{ steps.package.outputs.ipa_name }}
          if-no-files-found: error
          retention-days: 30
