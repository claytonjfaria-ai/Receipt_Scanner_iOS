name: ReceiptScannerBills
options:
  bundleIdPrefix: com.tap2know
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # The human milestone marker -- bumped "by feel" at real milestones, same split the main
    # plan already uses for Android's versionName/versionCode. Not CI-driven, unlike the build
    # number below: this one is a judgment call, not something to automate.
    MARKETING_VERSION: "0.1.0"
    # ${BUILD_NUMBER} via XcodeGen's generate-time env substitution (same mechanism Secrets.swift
    # uses) -- CI sets this to the GitHub Actions run number, so every CI build gets a real,
    # unique, monotonically-increasing CFBundleVersion with no manual bookkeeping. Local builds:
    # export BUILD_NUMBER=0 (or anything) before `xcodegen generate`, same as secrets.env --
    # unset, this literally reads "${BUILD_NUMBER}" in Diagnostics, which is a fine tell that
    # you're looking at a local build, not a CI one.
    CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
    SWIFT_VERSION: "5.9"
    # Unsigned CI builds: SideStore re-signs with the free Apple ID at install time.
    # Proven end to end against this exact combination in BillsCaptureTest, 2026-08-18
    # (see dev/iOs_Test) — CODE_SIGNING_ALLOWED=NO here, iLoader/SideStore sign afterward.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  ReceiptScannerBills:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Bills
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # VisionKit document scanner needs this or the app hard-crashes on first scan
        # (plan §8, confirmed in BillsCaptureTest).
        NSCameraUsageDescription: Used to capture bill pages with the document scanner.
        # Supabase project URL/anon key — mirrors Android's BuildConfig-field approach,
        # via XcodeGen's own env-var substitution (resolved when `xcodegen generate`
        # runs, from the shell environment — NOT an Xcode build setting, hence ${...}
        # rather than $(...)). Export SUPABASE_URL / SUPABASE_ANON_KEY before running
        # `xcodegen generate` locally; unset in CI, where XcodeGen leaves the literal
        # "${SUPABASE_URL}" string in place rather than failing — Secrets.swift treats
        # any value still starting with "${" as unconfigured. Neither value is a secret
        # in the sense that matters here (RLS/JWT do the real access control, same as
        # the Android app — Secrets management in the main plan), but they're still
        # gitignored rather than hardcoded, same convention as everywhere else.
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tap2know.receiptscanner.bills
        # 1,2 = iPhone + iPad. Plan §8 targets the iPad; day-to-day testing happens on
        # whatever device is at hand, same reasoning BillsCaptureTest used.
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"

  # Milestone 3's pure filing logic (Sources/Filing/) is the first code in this app worth real
  # correctness tests, not just "does it compile" — runs against the iOS Simulator in CI, a
  # separate SDK/destination from the unsigned-device build above, so it needs no signing either.
  ReceiptScannerBillsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ReceiptScannerBills

schemes:
  ReceiptScannerBills:
    build:
      targets:
        ReceiptScannerBills: [run, test, profile, analyze, archive]
        ReceiptScannerBillsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReceiptScannerBillsTests
    archive:
      config: Release
